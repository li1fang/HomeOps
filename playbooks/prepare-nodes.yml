---
- name: Ensure GPU preparation artifact directory exists
  hosts: localhost
  gather_facts: false
  vars:
    gpu_prep_artifacts_dir: "{{ output_dir | default('artifacts/itest') }}"
  tasks:
    - name: Ensure GPU preparation artifact directory
      ansible.builtin.file:
        path: "{{ gpu_prep_artifacts_dir }}"
        state: directory
        mode: "0755"

- name: Prepare GPU nodes for Kubernetes and CUDA baseline
  hosts: gpu_nodes
  become: true
  gather_facts: true
  vars:
    gpu_prep_artifacts_dir: "{{ output_dir | default('artifacts/itest') }}"
    nvidia_prereq_packages_default:
      - build-essential
      - dkms
      - gcc
      - make
      - pciutils
      - curl
      - software-properties-common
      - ca-certificates
    kernel_release: "{{ ansible_kernel }}"
    kernel_release_base: >-
      {{ kernel_release | regex_replace('-(generic|lowlatency)$', '') }}
    kernel_header_candidates: >-
      {{ (
          ['linux-headers-' ~ kernel_release] +
          (
            ['linux-headers-' ~ kernel_release_base ~ '-generic']
            if kernel_release != kernel_release_base else []
          )
        ) | unique }}
    user_defined_kernel_headers: >-
      {{ nvidia_kernel_headers_package
         if nvidia_kernel_headers_package is defined else [] }}
    user_defined_kernel_headers_list: >-
      {{ user_defined_kernel_headers
         if user_defined_kernel_headers is sequence and not (user_defined_kernel_headers is string)
         else ([user_defined_kernel_headers] if user_defined_kernel_headers else []) }}
    kernel_header_packages: >-
      {{ (kernel_header_candidates + user_defined_kernel_headers_list) | unique }}
    gpu_prereq_packages: >-
      {{ (
          (nvidia_prereq_packages | default(nvidia_prereq_packages_default)) +
          kernel_header_packages
        ) | unique }}
    nouveau_blacklist_path: "{{ nvidia_blacklist_file | default('/etc/modprobe.d/blacklist-nouveau.conf') }}"
    kernel_hold_targets:
      - "linux-image-{{ kernel_release }}"
      - "linux-headers-{{ kernel_release }}"
      - "linux-modules-{{ kernel_release }}"
      - "linux-modules-extra-{{ kernel_release }}"
  pre_tasks:
    - name: Assert supported operating system family
      ansible.builtin.assert:
        that:
          - ansible_os_family | lower == 'debian'
        fail_msg: >-
          GPU preparation currently supports Debian/Ubuntu families only; detected {{ ansible_os_family }}.
    - name: Unmask packagekit service to allow apt operations
      ansible.builtin.systemd:
        name: packagekit.service
        masked: false
        enabled: false
        state: stopped
      when: ansible_service_mgr == 'systemd'

    - name: Capture currently held packages
      ansible.builtin.command:
        cmd: apt-mark showhold
      register: apt_mark_showhold
      changed_when: false
      failed_when: apt_mark_showhold.rc not in [0]

    - name: Identify held kernel packages for running release
      ansible.builtin.set_fact:
        held_kernel_packages_before: "{{ (kernel_hold_targets | intersect(apt_mark_showhold.stdout_lines | default([]))) | to_json | from_json }}"

    - name: Unlock held kernel packages for GPU preparation
      ansible.builtin.command:
        cmd: "apt-mark unhold {{ item }}"
      loop: "{{ held_kernel_packages_before | default([]) }}"
      register: kernel_unhold_results
      changed_when: held_kernel_packages_before | length > 0
      failed_when: kernel_unhold_results is failed
      when: held_kernel_packages_before | length > 0

    - name: Ensure dpkg is in a consistent state before installing packages
      ansible.builtin.command:
        cmd: dpkg --configure -a
      register: dpkg_preconfigure
      changed_when: false
      failed_when: dpkg_preconfigure.rc not in [0]
  tasks:
    - name: Capture conflicting 6.14.0-29 kernel packages before purge
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -l | grep '6.14.0-29' || true
      args:
        executable: /bin/bash
      register: purge_conflicting_kernels_before
      changed_when: false
      failed_when: false

    - name: Persist pre-purge kernel package snapshot
      ansible.builtin.copy:
        dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_dpkg-query_BEFORE_purge.log"
        content: |-
          Command: dpkg -l | grep '6.14.0-29' || true
          Return code: {{ hostvars[inventory_hostname].purge_conflicting_kernels_before.rc }}
          --- stdout ---
          {{ hostvars[inventory_hostname].purge_conflicting_kernels_before.stdout | default('') }}
          {% set before_stderr = hostvars[inventory_hostname].purge_conflicting_kernels_before.stderr | default('') %}
          {% if before_stderr | length > 0 %}
          --- stderr ---
          {{ before_stderr }}
          {% endif %}
        mode: "0644"
      delegate_to: localhost

    - name: Force purge conflicting 6.14.0-29 kernel packages
      ansible.builtin.shell: |
        set -o pipefail
        packages="$(dpkg-query -W -f='${Package}\n' \
          'linux-image-6.14.0-29*' \
          'linux-headers-6.14.0-29*' \
          'linux-modules-6.14.0-29*' \
          'linux-modules-nvidia-550-6.14.0-29*' 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]\+$//')"
        if [ -n "${packages}" ]; then
          echo "Purging packages: ${packages}"
          DEBIAN_FRONTEND=noninteractive apt-get purge -y --allow-change-held-packages ${packages}
        else
          echo "No conflicting 6.14.0-29 kernel packages detected."
        fi
      args:
        executable: /bin/bash
      register: purge_conflicting_kernels
      changed_when: >-
        purge_conflicting_kernels.rc == 0 and (
          'The following packages will be REMOVED:' in (purge_conflicting_kernels.stdout | default('')) or
          'The following packages will be REMOVED:' in (purge_conflicting_kernels.stderr | default(''))
        )
      failed_when: purge_conflicting_kernels.rc not in [0]

    - name: Persist kernel purge verbose output
      ansible.builtin.copy:
        dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_apt-purge_VERBOSE.log"
        content: |-
          Command: Force purge conflicting 6.14.0-29 kernel packages
          Return code: {{ hostvars[inventory_hostname].purge_conflicting_kernels.rc }}
          --- stdout ---
          {{ hostvars[inventory_hostname].purge_conflicting_kernels.stdout | default('') }}
          {% set purge_stderr = hostvars[inventory_hostname].purge_conflicting_kernels.stderr | default('') %}
          {% if purge_stderr | length > 0 %}
          --- stderr ---
          {{ purge_stderr }}
          {% endif %}
        mode: "0644"
      delegate_to: localhost

    - name: Capture conflicting 6.14.0-29 kernel packages after purge
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -l | grep '6.14.0-29' || true
      args:
        executable: /bin/bash
      register: purge_conflicting_kernels_after
      changed_when: false
      failed_when: false

    - name: Persist post-purge kernel package snapshot
      ansible.builtin.copy:
        dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_dpkg-query_AFTER_purge.log"
        content: |-
          Command: dpkg -l | grep '6.14.0-29' || true
          Return code: {{ hostvars[inventory_hostname].purge_conflicting_kernels_after.rc }}
          --- stdout ---
          {{ hostvars[inventory_hostname].purge_conflicting_kernels_after.stdout | default('') }}
          {% set after_stderr = hostvars[inventory_hostname].purge_conflicting_kernels_after.stderr | default('') %}
          {% if after_stderr | length > 0 %}
          --- stderr ---
          {{ after_stderr }}
          {% endif %}
        mode: "0644"
      delegate_to: localhost

    - name: Reconfigure dpkg after kernel package purge
      ansible.builtin.command:
        cmd: dpkg --configure -a
      register: dpkg_post_purge
      changed_when: false
      failed_when: dpkg_post_purge.rc not in [0]

    - name: Repair dependencies after kernel package purge  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: apt-get -f install
      register: apt_fix_dependencies
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: false
      failed_when: apt_fix_dependencies.rc not in [0]

    - name: Collect kernel state snapshot for diagnostics
      block:
        - name: Capture running kernel release
          ansible.builtin.command:
            cmd: uname -r
          register: kernel_uname_r
          changed_when: false
          failed_when: false

        - name: Persist running kernel release artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_uname-r.log"
            content: |-
              Command: uname -r
              Return code: {{ kernel_uname_r.rc }}
              --- stdout ---
              {{ kernel_uname_r.stdout | default('') }}
              {% if kernel_uname_r.stderr is defined and kernel_uname_r.stderr | length > 0 %}
              --- stderr ---
              {{ kernel_uname_r.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

        - name: Capture installed kernel images
          ansible.builtin.shell: |
            set -o pipefail
            dpkg -l | grep 'linux-image-'
          args:
            executable: /bin/bash
          register: kernel_installed_images
          changed_when: false
          failed_when: false

        - name: Persist installed kernel images artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_installed-kernels.log"
            content: |-
              Command: dpkg -l | grep 'linux-image-'
              Return code: {{ kernel_installed_images.rc }}
              --- stdout ---
              {{ kernel_installed_images.stdout | default('') }}
              {% if kernel_installed_images.stderr is defined and kernel_installed_images.stderr | length > 0 %}
              --- stderr ---
              {{ kernel_installed_images.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

        - name: Capture installed kernel headers
          ansible.builtin.shell: |
            set -o pipefail
            dpkg -l | grep 'linux-headers-'
          args:
            executable: /bin/bash
          register: kernel_installed_headers
          changed_when: false
          failed_when: false

        - name: Persist installed kernel headers artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_installed-headers.log"
            content: |-
              Command: dpkg -l | grep 'linux-headers-'
              Return code: {{ kernel_installed_headers.rc }}
              --- stdout ---
              {{ kernel_installed_headers.stdout | default('') }}
              {% if kernel_installed_headers.stderr is defined and kernel_installed_headers.stderr | length > 0 %}
              --- stderr ---
              {{ kernel_installed_headers.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

        - name: Capture /usr/src directory listing
          ansible.builtin.shell: |
            set -o pipefail
            ls -alR /usr/src
          args:
            executable: /bin/bash
          register: usr_src_listing
          changed_when: false
          failed_when: false

        - name: Persist /usr/src directory listing artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_usr-src-listing.log"
            content: |-
              Command: ls -alR /usr/src
              Return code: {{ usr_src_listing.rc }}
              --- stdout ---
              {{ usr_src_listing.stdout | default('') }}
              {% if usr_src_listing.stderr is defined and usr_src_listing.stderr | length > 0 %}
              --- stderr ---
              {{ usr_src_listing.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

    - name: Check if broken NVIDIA modules package is installed
      ansible.builtin.command:
        cmd: dpkg-query -W -f='${Status}' linux-modules-nvidia-550-6.14.0-29-generic
      register: nvidia_modules_status
      changed_when: false
      failed_when: false

    - name: Force remove broken NVIDIA modules package with dpkg
      ansible.builtin.command:
        cmd: dpkg --remove --force-remove-reinstreq linux-modules-nvidia-550-6.14.0-29-generic
      register: nvidia_modules_force_remove
      changed_when: nvidia_modules_force_remove.rc == 0
      failed_when: nvidia_modules_force_remove.rc not in [0]
      when:
        - nvidia_modules_status.rc == 0
        - "'install ok installed' in (nvidia_modules_status.stdout | default(''))"

    - name: Ensure dpkg is reconfigured after removing broken packages
      ansible.builtin.command:
        cmd: dpkg --configure -a
      register: dpkg_post_force_remove
      changed_when: false
      failed_when: dpkg_post_force_remove.rc not in [0]

    - name: Clean apt package cache before GPU prerequisite installation  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: apt-get clean
      register: apt_clean_cache
      changed_when: false

    - name: Update apt cache for GPU prerequisites
      ansible.builtin.apt:
        update_cache: true

    - name: Install GPU prerequisite packages
      ansible.builtin.apt:
        name: "{{ gpu_prereq_packages }}"
        state: present
        install_recommends: false
        force_apt_get: true
      register: gpu_prereq_install

    - name: Gather kernel header linker script status (generic)
      ansible.builtin.stat:
        path: "/usr/src/linux-headers-{{ kernel_release }}/scripts/module.lds"
      register: kernel_module_lds_generic

    - name: Gather kernel header linker script status (base release)
      ansible.builtin.stat:
        path: "/usr/src/linux-headers-{{ kernel_release_base }}/scripts/module.lds"
      register: kernel_module_lds_base

    - name: Purge kernel headers when linker script missing
      ansible.builtin.apt:
        name: "{{ kernel_header_packages }}"
        state: absent
        purge: true
        force_apt_get: true
      register: purge_kernel_headers
      when: not (kernel_module_lds_generic.get('stat', {}).get('exists', false))
            and not (kernel_module_lds_base.get('stat', {}).get('exists', false))

    - name: Reinstall kernel headers after purge
      ansible.builtin.apt:
        name: "{{ kernel_header_packages }}"
        state: present
        install_recommends: false
        force_apt_get: true
      register: reinstall_kernel_headers
      when: purge_kernel_headers is defined and purge_kernel_headers.changed

    - name: Refresh generic kernel header linker script status
      ansible.builtin.stat:
        path: "/usr/src/linux-headers-{{ kernel_release }}/scripts/module.lds"
      register: kernel_module_lds_generic
      when: (purge_kernel_headers is defined and purge_kernel_headers.changed) or
            (reinstall_kernel_headers is defined and reinstall_kernel_headers.changed)

    - name: Refresh base kernel header linker script status
      ansible.builtin.stat:
        path: "/usr/src/linux-headers-{{ kernel_release_base }}/scripts/module.lds"
      register: kernel_module_lds_base
      when: (purge_kernel_headers is defined and purge_kernel_headers.changed) or
            (reinstall_kernel_headers is defined and reinstall_kernel_headers.changed)

    - name: Collect kernel header diagnostics when linker script missing
      when: not (kernel_module_lds_generic.get('stat', {}).get('exists', false))
            and not (kernel_module_lds_base.get('stat', {}).get('exists', false))
      block:
        - name: Capture apt reinstall output for kernel headers
          ansible.builtin.shell: |
            set -o pipefail
            DEBIAN_FRONTEND=noninteractive \
            apt-get install --reinstall -y linux-headers-{{ kernel_release }}
          args:
            executable: /bin/bash
          register: kernel_header_apt_reinstall
          changed_when: false
          failed_when: false

        - name: Persist apt reinstall diagnostic artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_apt_reinstall.log"
            content: |-
              Command: DEBIAN_FRONTEND=noninteractive apt-get install --reinstall -y linux-headers-{{ kernel_release }}
              Return code: {{ kernel_header_apt_reinstall.rc }}
              --- stdout ---
              {{ kernel_header_apt_reinstall.stdout | default('') }}
              {% if kernel_header_apt_reinstall.stderr is defined and kernel_header_apt_reinstall.stderr | length > 0 %}
              --- stderr ---
              {{ kernel_header_apt_reinstall.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

        - name: Capture dpkg query for kernel headers
          ansible.builtin.shell: |
            set -o pipefail
            dpkg -l | grep 'linux-headers-{{ kernel_release }}'
          args:
            executable: /bin/bash
          register: kernel_header_dpkg_query
          changed_when: false
          failed_when: false

        - name: Persist dpkg query diagnostic artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_dpkg_query.log"
            content: |-
              Command: dpkg -l | grep 'linux-headers-{{ kernel_release }}'
              Return code: {{ kernel_header_dpkg_query.rc }}
              --- stdout ---
              {{ kernel_header_dpkg_query.stdout | default('') }}
              {% if kernel_header_dpkg_query.stderr is defined and kernel_header_dpkg_query.stderr | length > 0 %}
              --- stderr ---
              {{ kernel_header_dpkg_query.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

        - name: Capture kernel header directory listing
          ansible.builtin.shell: |
            set -o pipefail
            ls -alR /usr/src/linux-headers-{{ kernel_release }}
          args:
            executable: /bin/bash
          register: kernel_header_dir_listing
          changed_when: false
          failed_when: false

        - name: Persist kernel header directory listing artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_header_dir_listing.log"
            content: |-
              Command: ls -alR /usr/src/linux-headers-{{ kernel_release }}
              Return code: {{ kernel_header_dir_listing.rc }}
              --- stdout ---
              {{ kernel_header_dir_listing.stdout | default('') }}
              {% if kernel_header_dir_listing.stderr is defined and kernel_header_dir_listing.stderr | length > 0 %}
              --- stderr ---
              {{ kernel_header_dir_listing.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

    - name: Blacklist nouveau kernel driver
      ansible.builtin.copy:
        dest: "{{ nouveau_blacklist_path }}"
        content: |
          # Managed by HomeOps GPU preparation
          blacklist nouveau
          options nouveau modeset=0
        owner: root
        group: root
        mode: "0644"
      notify:
        - Rebuild initramfs after nouveau blacklist
        - Remove nouveau kernel module if loaded
      register: nouveau_blacklist

    - name: Install NVIDIA driver package
      ansible.builtin.apt:
        name: "{{ nvidia_driver_package | default('nvidia-driver-535') }}"
        state: present
        update_cache: false
        force_apt_get: true
      register: nvidia_driver_install

    - name: Aggregate GPU preparation change indicators
      ansible.builtin.set_fact:
        gpu_prep_change_map:
          purge_conflicting_kernels: >-
            {{ (purge_conflicting_kernels is defined and purge_conflicting_kernels is changed) | bool }}
          nvidia_modules_force_remove: >-
            {{ (nvidia_modules_force_remove is defined and nvidia_modules_force_remove is changed) | bool }}
          gpu_prereq_install: >-
            {{ (gpu_prereq_install is defined and gpu_prereq_install is changed) | bool }}
          purge_kernel_headers: >-
            {{ (purge_kernel_headers is defined and purge_kernel_headers is changed) | bool }}
          reinstall_kernel_headers: >-
            {{ (reinstall_kernel_headers is defined and reinstall_kernel_headers is changed) | bool }}
          nouveau_blacklist: >-
            {{ (nouveau_blacklist is defined and nouveau_blacklist is changed) | bool }}
          nvidia_driver_install: >-
            {{ (nvidia_driver_install is defined and nvidia_driver_install is changed) | bool }}

    - name: Identify reboot trigger tasks
      ansible.builtin.set_fact:
        reboot_trigger_tasks: >-
          {{ gpu_prep_change_map | default({})
             | dict2items
             | selectattr('value', 'truthy')
             | map(attribute='key')
             | list }}

    - name: Determine if reboot is required
      ansible.builtin.set_fact:
        reboot_required: >-
          {{ (reboot_trigger_tasks | default([]) | length) > 0 }}

    - name: Persist reboot decision artifact
      ansible.builtin.copy:
        dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_reboot-decision.json"
        content: |-
          {{ {
                'reboot_required': reboot_required | default(false) | bool,
                'reboot_trigger_tasks': reboot_trigger_tasks | default([]),
                'change_map': gpu_prep_change_map | default({})
             } | to_nice_json }}
        mode: "0644"
      delegate_to: localhost

    - name: Report reboot decision summary
      ansible.builtin.debug:
        msg: >-
          GPU preparation reboot_required={{ reboot_required | default(false) | bool }};
          trigger_tasks={{ reboot_trigger_tasks | default([]) }}

    - name: Collect boot-switching diagnostics
      block:
        - name: Capture verbose EFI boot entries  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: efibootmgr -v
          register: efibootmgr_result
          changed_when: false
          failed_when:
            - efibootmgr_result.rc != 0
            - (efibootmgr_result.stdout | default('') | trim | length) == 0

        - name: Persist EFI boot entries artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_efibootmgr.log"
            content: |-
              Command: efibootmgr -v
              Return code: {{ efibootmgr_result.rc }}
              --- stdout ---
              {{ efibootmgr_result.stdout | default('') }}
              {% if efibootmgr_result.stderr is defined and efibootmgr_result.stderr | length > 0 %}
              --- stderr ---
              {{ efibootmgr_result.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

        - name: Read GRUB environment file  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: cat /boot/grub/grubenv
          register: grubenv_result
          changed_when: false
          failed_when:
            - grubenv_result.rc != 0
            - (grubenv_result.stdout | default('') | trim | length) == 0

        - name: Persist GRUB environment artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_grubenv.log"
            content: |-
              Source: /boot/grub/grubenv
              Return code: {{ grubenv_result.rc }}
              --- stdout ---
              {{ grubenv_result.stdout | default('') }}
              {% if grubenv_result.stderr is defined and grubenv_result.stderr | length > 0 %}
              --- stderr ---
              {{ grubenv_result.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

        - name: Read GRUB default configuration file  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: cat /etc/default/grub
          register: grub_default_result
          changed_when: false
          failed_when:
            - grub_default_result.rc != 0
            - (grub_default_result.stdout | default('') | trim | length) == 0

        - name: Persist GRUB default configuration artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_grub_cfg_default.log"
            content: |-
              Source: /etc/default/grub
              Return code: {{ grub_default_result.rc }}
              --- stdout ---
              {{ grub_default_result.stdout | default('') }}
              {% if grub_default_result.stderr is defined and grub_default_result.stderr | length > 0 %}
              --- stderr ---
              {{ grub_default_result.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

        - name: Capture EFI boot tree listing  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: ls -lR /boot/efi/EFI/
          register: boot_efi_tree_result
          changed_when: false
          failed_when:
            - boot_efi_tree_result.rc != 0
            - (boot_efi_tree_result.stdout | default('') | trim | length) == 0

        - name: Persist EFI boot tree artifact
          ansible.builtin.copy:
            dest: "{{ gpu_prep_artifacts_dir }}/{{ inventory_hostname }}_boot_efi_tree.log"
            content: |-
              Command: ls -lR /boot/efi/EFI/
              Return code: {{ boot_efi_tree_result.rc }}
              --- stdout ---
              {{ boot_efi_tree_result.stdout | default('') }}
              {% if boot_efi_tree_result.stderr is defined and boot_efi_tree_result.stderr | length > 0 %}
              --- stderr ---
              {{ boot_efi_tree_result.stderr }}
              {% endif %}
            mode: "0644"
          delegate_to: localhost

    - name: Configure remaining packages after driver installation
      ansible.builtin.command:
        cmd: dpkg --configure -a
      register: dpkg_postconfigure
      changed_when: false
      failed_when: dpkg_postconfigure.rc not in [0]

    - name: Reboot node to synchronize kernel state
      ansible.builtin.reboot:
        msg: HomeOps GPU preparation reboot to finalize kernel updates
        reboot_timeout: 1200
        post_reboot_delay: 10
      when:
        - (reboot_required | default(false)) | bool
        - false  # Issue #119 diagnostic: skip automatic reboot to avoid manual intervention

    - name: Gather kernel header linker script status post reboot (generic)
      ansible.builtin.stat:
        path: "/usr/src/linux-headers-{{ kernel_release }}/scripts/module.lds"
      register: kernel_module_lds_generic

    - name: Gather kernel header linker script status post reboot (base release)
      ansible.builtin.stat:
        path: "/usr/src/linux-headers-{{ kernel_release_base }}/scripts/module.lds"
      register: kernel_module_lds_base

    - name: Assert kernel headers provide module linker script
      ansible.builtin.assert:
        that:
          - kernel_module_lds_generic.get('stat', {}).get('exists', false)
            or kernel_module_lds_base.get('stat', {}).get('exists', false)
        fail_msg: >-
          Required kernel header linker script module.lds was not found after reinstalling
          linux-headers for {{ kernel_release }}.

    - name: Ensure nvidia-persistenced service is enabled
      ansible.builtin.systemd:
        name: nvidia-persistenced
        state: started
        enabled: true
      register: nvidia_persistenced_state
      failed_when: >-
        nvidia_persistenced_state is failed and
        (
          'not found' not in (nvidia_persistenced_state.msg | default('') | lower)
          and 'could not be found' not in (nvidia_persistenced_state.msg | default('') | lower)
        )

    - name: Gather lspci output for NVIDIA adapters
      ansible.builtin.command:
        cmd: lspci -nn
      register: lspci_output
      changed_when: false

    - name: Assert NVIDIA GPU detected
      ansible.builtin.assert:
        that:
          - "'NVIDIA' in lspci_output.stdout"
        fail_msg: >-
          No NVIDIA GPU detected on {{ inventory_hostname }}. lspci output stored in task result for diagnostics.

    - name: Run nvidia-smi to validate driver readiness
      ansible.builtin.command:
        cmd: nvidia-smi
      register: nvidia_smi_check
      changed_when: false
      retries: 3
      delay: 10
      until: nvidia_smi_check.rc == 0


    - name: Restore kernel package holds after GPU preparation
      ansible.builtin.command:
        cmd: "apt-mark hold {{ item }}"
      loop: "{{ held_kernel_packages_before | default([]) }}"
      register: kernel_rehold_results
      changed_when: held_kernel_packages_before | length > 0
      failed_when: kernel_rehold_results is failed
      when: held_kernel_packages_before | length > 0

  handlers:
    - name: Rebuild initramfs after nouveau blacklist
      ansible.builtin.command:
        cmd: update-initramfs -u
      changed_when: true

    - name: Remove nouveau kernel module if loaded
      ansible.builtin.command:
        cmd: modprobe -r nouveau
      register: remove_nouveau
      failed_when: remove_nouveau.rc not in [0, 1]
      changed_when: remove_nouveau.rc == 0
